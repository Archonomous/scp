<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Straight edges sit on a 16-unit grid (1px at 32px), so they land on
       whole pixels at 32, 64, 128, 256, 512, 1024 and 2048. -->
  <defs>
    <radialGradient id="tile" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2A2459"/>
      <stop offset="1" stop-color="#0E0F22"/>
    </radialGradient>
    <linearGradient id="body" x1="0.05" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#36E0FF"/>
      <stop offset="0.45" stop-color="#6B5BFF"/>
      <stop offset="0.75" stop-color="#B14BFF"/>
      <stop offset="1" stop-color="#FF4FA8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <path id="pad" d="M176 144H336C384 144 410 172 420 216L444 306C452 344 428 368 398 368C378 368 364 358 352 340L330 320H182L160 340C148 358 134 368 114 368C84 368 60 344 68 306L92 216C102 172 128 144 176 144Z"/>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <use href="#pad" fill="url(#body)" filter="url(#glow)" opacity="0.75"/>
  <use href="#pad" fill="url(#body)"/>
  <!-- Highlight along the top edge -->
  <path d="M176 152H336C372 152 396 172 406 204" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  <!-- D-pad -->
  <rect x="144" y="208" width="64" height="32" rx="6" fill="#15132E"/>
  <rect x="160" y="192" width="32" height="64" rx="6" fill="#15132E"/>
  <!-- Face buttons -->
  <circle cx="336" cy="196" r="14" fill="#15132E"/>
  <circle cx="336" cy="252" r="14" fill="#15132E"/>
  <circle cx="308" cy="224" r="14" fill="#15132E"/>
  <circle cx="364" cy="224" r="14" fill="#15132E"/>
  <!-- Studio motif: tilted square -->
  <rect x="240" y="208" width="32" height="32" rx="6" fill="#FFFFFF" transform="rotate(15 256 224)"/>
</svg>
